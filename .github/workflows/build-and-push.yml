name: Deploy rdv-backend-v2 (Japan)

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-northeast1 # 도쿄
  GAR_REPO: rdv-backend-v2 # 저장소 이름
  SERVICE_NAME: rdv-backend-v2 # 서비스 이름

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 구글 인증
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # 2. Docker 설정 (Cloud SDK)
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Docker Configure
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # 3. Buildx 설정
      # 캐시 기능을 쓰기 위해 필수적인 단계입니다.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 빌드 및 푸시
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. Cloud Run 배포
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

          # [비밀 파일 마운트]
          secrets: |
            /secrets/.env=RDV_BACKEND_ENV:latest

          # [시스템 변수]
          # QUEUE_DRIVER=cloud-tasks: BullMQ 대신 Cloud Tasks 사용 (Phase 3 검증 통과 후 전환)
          env_vars: |
            NODE_ENV=production
            LOG_LEVEL=debug
            QUEUE_DRIVER=cloud-tasks
            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            GCP_LOCATION=${{ vars.GCP_LOCATION }}
            CLOUD_TASKS_INVOKER_SA=${{ vars.CLOUD_TASKS_INVOKER_SA }}
            CLOUD_TASKS_TARGET_URL=${{ vars.CLOUD_TASKS_TARGET_URL }}

          # [포트, 인스턴스, 메모리, 실행환경, CPU, 서비스 계정 설정]
          # - min-instances 0: 유휴 시 스케일 제로 허용 (월 ~7만원 상시 과금 제거)
          # - max-instances 1: 토이 규모 트래픽 + 비용 폭주 방지. Cloud Tasks
          #   재시도(최대 3회, exponential backoff)로 일시적 포화 상황 완화.
          # - cpu-throttling: 요청 처리 중에만 CPU 할당 (유휴 시 과금 제거)
          # - service-account: Cloud Tasks enqueuer·invoker 권한을 가진 전용 SA
          flags: '--port 3000 --min-instances 0 --max-instances 1 --memory 1Gi --execution-environment gen2 --cpu-throttling --service-account ${{ vars.CLOUD_RUN_SERVICE_ACCOUNT }}'
