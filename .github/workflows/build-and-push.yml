name: Deploy rdv-backend-v2 (Japan)

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-northeast1 # 도쿄
  GAR_REPO: rdv-backend-v2 # 저장소 이름
  SERVICE_NAME: rdv-backend-v2 # 서비스 이름

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 구글 인증
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # 2. Docker 설정 (Cloud SDK)
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Docker Configure
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # 3. Buildx 설정
      # 캐시 기능을 쓰기 위해 필수적인 단계입니다.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 빌드 및 푸시
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. Cloud Run 배포
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

          # [비밀 파일 마운트]
          secrets: |
            /secrets/.env=RDV_BACKEND_ENV:latest

          # [시스템 변수]
          # QUEUE_DRIVER: bullmq | cloud-tasks
          #   - bullmq (현재): 기존 Redis 기반 큐 유지
          #   - cloud-tasks: Cloud Tasks로 전환 (Phase 3 스테이징 검증 후 변경)
          env_vars: |
            NODE_ENV=production
            LOG_LEVEL=debug
            QUEUE_DRIVER=bullmq
            GCP_PROJECT_ID=exalted-gamma-485513-e4
            GCP_LOCATION=asia-northeast1
            CLOUD_TASKS_INVOKER_SA=rdv-backend-runtime@exalted-gamma-485513-e4.iam.gserviceaccount.com
            CLOUD_TASKS_TARGET_URL=https://rdv-backend-v2-213001418399.asia-northeast1.run.app/internal/queue/event

          # [포트, 인스턴스, 메모리, 실행환경, CPU 설정]
          # NOTE: --min-instances 1, --no-cpu-throttling 은 월 ~7만원 상시 과금의 원인.
          # Phase 4(스테이징 검증 완료 후) 에서 --min-instances 0 으로 변경 예정.
          flags: '--port 3000 --min-instances 1 --max-instances 10 --memory 1Gi --execution-environment gen2 --no-cpu-throttling'
