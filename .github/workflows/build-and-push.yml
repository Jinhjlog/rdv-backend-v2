name: Deploy rdv-backend-v2 (Japan)

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-northeast1 # 도쿄
  GAR_REPO: rdv-backend-v2 # 저장소 이름
  SERVICE_NAME: rdv-backend-v2 # 서비스 이름

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 구글 인증
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # 2. Docker 설정
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Docker Configure
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # 3. 빌드 및 푸시
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. Cloud Run 배포
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

          # [핵심] Secret Manager의 'RDV_BACKEND_ENV'을 컨테이너 내부의 '.env' 파일로 생성
          # 좌측: 컨테이너 내부 경로 / 우측: Secret Manager 이름
          secrets: |
            /usr/src/app/.env=RDV_BACKEND_ENV:latest

          # [시스템 변수]
          # .env 파일에 있더라도 PORT와 NODE_ENV는 Cloud Run 시스템 설정을 위해 명시하는 게 안전합니다.
          env_vars: |
            NODE_ENV=production
            PORT=3000
